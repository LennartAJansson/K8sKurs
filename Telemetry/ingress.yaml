# =============================================================================
# Ingress för monitoreringsstacken - k3d-home (*.local istället för *.ubk3s)
#
# Varje ingress får ett EGET certifikat från cert-manager (ClusterIssuer
# local-ca): annotationen cert-manager.io/cluster-issuer + tls.secretName
# <namn>-tls gör att cert-managers ingress-shim skapar Certificate och Secret.
# Samma mönster som plattformens appar. Kräver att cert-manager och local-ca
# finns (Platform\scripts\install-cert-manager.ps1). Utan dem saknas Secreten
# och Traefik faller tillbaka på det delade mkcert-certifikatet (TLSStore
# default, traefik-tls.yaml) - ingenting går sönder, men certifikatet är då
# det gemensamma.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: local-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.local
      secretName: grafana-tls
  rules:
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: telemetry-grafana
                port:
                  number: 80

