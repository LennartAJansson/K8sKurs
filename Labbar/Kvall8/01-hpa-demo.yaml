# =============================================================================
# Labb 2b - automatisk skalning (HorizontalPodAutoscaler)
# Samma labb som var planerad till kväll 7, nu med eget namespace-objekt
# eftersom namespacet lab städades bort förra gången.
#
#   kubectl apply -f 01-hpa-demo.yaml
#   kubectl get hpa -n lab -w            # i ett eget fönster
#
# Generera last (i ett annat fönster, avbryt med Ctrl+C) - en enda rad:
#   kubectl run load -n lab --rm -it --image=busybox:1.36 --restart=Never -- /bin/sh -c "while true; do wget -q -O- http://web >/dev/null; done"
#
# Imagen är Kubernetes egen HPA-demo (php-apache): varje anrop räknar en
# stund och drar CPU, i vila ligger den nära 0. Med nginx skalade HPA:n till
# 5 direkt - nginx startar en worker per CPU-kärna och sprängde 50m-requesten
# redan vid start.
#
# Kräver metrics-server - den följer med k3s/k3d (kubectl top pods fungerar).
# Städa: kubectl delete namespace lab
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          # HPA räknar CPU i procent AV REQUEST - utan requests ingen skalning.
          resources:
            requests:
              cpu: 200m
            limits:
              cpu: 500m
          # Podden räknas först när den är Ready - CPU under uppstarten
          # påverkar då inte HPA:n.
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  # Skala upp högst en podd per 30 s, så att det syns steg för steg i
  # "kubectl get hpa -w".
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    # Standard är att vänta 5 min innan nedskalning (skydd mot att poddar
    # startas och stoppas fram och tillbaka). I labben: vänta 30 s och ta
    # sedan bort en podd var 15:e sekund.
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
